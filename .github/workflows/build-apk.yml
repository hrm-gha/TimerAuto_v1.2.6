name: Build Timer Auto Clicker APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Unzip Project if Needed
      run: |
        TARGET_ZIP=$(find . -maxdepth 2 -type f \( -name "*1.2.6*.zip*" -o -name "*.zip" -o -name "*.zip.html" \) | sort -V | tail -n 1)
        if [ -n "$TARGET_ZIP" ]; then
          echo "Processing newest archive: $TARGET_ZIP"
          if [[ "$TARGET_ZIP" == *.html ]]; then
            CLEAN_ZIP="${TARGET_ZIP%.html}"
            mv "$TARGET_ZIP" "$CLEAN_ZIP"
            TARGET_ZIP="$CLEAN_ZIP"
          fi
          if [ ! -d "app/src" ]; then
            echo "Unpacking full archive because app/src was not found..."
            unzip -o "$TARGET_ZIP" || true
          else
            echo "Direct source tree app/src already present. Updating only newer files..."
            unzip -u -o "$TARGET_ZIP" || true
          fi
          echo "Archive processing completed."
        fi

    - name: Cache Fixed Keystore for Seamless Overwrite Updates
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: fixed-android-debug-keystore-v3

    - name: Prepare Fixed Keystore with Native JDK Keytool
      run: |
        mkdir -p ~/.android
        # If keystore doesn't exist in cache, generate native Java Keystore with JDK keytool
        if [ ! -f ~/.android/debug.keystore ]; then
          echo "Generating native Java keystore directly with JDK keytool..."
          keytool -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
        fi

        # Remove any stale/corrupted keystore from repo
        find . -name "debug.keystore" -exec rm -f {} \;
        # Copy the genuine JDK keystore into every app folder
        find . -type d -name "app" -exec cp ~/.android/debug.keystore {}/debug.keystore \;

    - name: Build APK with Gradle
      run: |
        TARGET=$(find . -name "settings.gradle.kts" | head -n 1)
        if [ -n "$TARGET" ]; then
          PROJECT_DIR="$(dirname "$TARGET")"
        else
          PROJECT_DIR="."
        fi
        echo "Building in $PROJECT_DIR"
        cd "$PROJECT_DIR"

        echo "android.useAndroidX=true" > gradle.properties
        echo "android.nonTransitiveRClass=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        else
          gradle assembleDebug --no-daemon --stacktrace
        fi

    - name: Prepare Named APKs
      run: |
        APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
        if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
          DIR=$(dirname "$APK_PATH")
          cp "$APK_PATH" "$DIR/TimerAutoClickerPro-v1.2.6.apk"
          echo "Created $DIR/TimerAutoClickerPro-v1.2.6.apk"
        fi

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TimerAutoClickerPro-v1.2.6-APK
        path: "**/app/build/outputs/apk/debug/*.apk"

    - name: Create or Update GitHub Release with Direct APK Download
      uses: softprops/action-gh-release@v2
      if: always()
      with:
        tag_name: latest-build
        name: "Timer Auto Clicker Pro v1.2.6 最新APK (解凍不要)"
        body: |
          ### 📱 Timer Auto Clicker Pro (v1.2.6 最新版)
          - 【増殖・終了バグ完全解消】バー（HUD）増殖および終了ボタンで消えない問題を根本解決
          - 【即時消去】HUD終了ボタンおよびメイン画面の「🛑 終了 / 🛑 バー消去」で全オーバーレイを即時完全削除
          - クリックアシスタント等の他アプリに潜り込まない「絶対的最前面（Accessibility Overlay）」安全保護
          - 直下にある `TimerAutoClickerPro-v1.2.6.apk` をタップすると**解凍不要で直接インストール**できます！
        files: |
          **/app/build/outputs/apk/debug/*.apk
      continue-on-error: true
