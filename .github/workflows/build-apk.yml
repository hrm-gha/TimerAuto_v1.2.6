name: Build Timer Auto Clicker APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Unpack Project Zip if Present
      run: |
        # If user uploaded the project as a ZIP archive, unpack it
        TARGET_ZIP=$(find . -maxdepth 2 -type f \( -name "*1.2.6*.zip*" -o -name "*.zip" -o -name "*.zip.html" \) | sort -V | tail -n 1)
        if [ -n "$TARGET_ZIP" ]; then
          echo "Found project archive: $TARGET_ZIP"
          if [[ "$TARGET_ZIP" == *.html ]]; then
            CLEAN_ZIP="${TARGET_ZIP%.html}"
            mv "$TARGET_ZIP" "$CLEAN_ZIP"
            TARGET_ZIP="$CLEAN_ZIP"
          fi
          if [ ! -d "app/src" ]; then
            echo "Unpacking archive to root..."
            unzip -o "$TARGET_ZIP" || true
          else
            echo "Direct source tree already present."
            unzip -u -o "$TARGET_ZIP" || true
          fi
        fi

    - name: Ensure Keystore Exists
      run: |
        mkdir -p app
        if [ ! -f "app/debug.keystore" ]; then
          echo "Generating debug keystore..."
          keytool -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore app/debug.keystore \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 || true
        fi

    - name: Build APK with Gradle
      run: |
        TARGET=$(find . -name "settings.gradle.kts" | head -n 1)
        if [ -n "$TARGET" ]; then
          PROJECT_DIR="$(dirname "$TARGET")"
        else
          PROJECT_DIR="."
        fi
        echo "Building in $PROJECT_DIR"
        cd "$PROJECT_DIR"

        echo "android.useAndroidX=true" > gradle.properties
        echo "android.nonTransitiveRClass=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

        if [ ! -f gradlew ]; then
          gradle wrapper --gradle-version 8.6 || true
        fi

        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        else
          gradle assembleDebug --no-daemon --stacktrace
        fi

    - name: Prepare Named APKs
      run: |
        APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
        if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
          DIR=$(dirname "$APK_PATH")
          cp "$APK_PATH" "$DIR/TimerAutoClickerPro-v1.2.6.apk"
          echo "Created $DIR/TimerAutoClickerPro-v1.2.6.apk"
        fi

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: TimerAutoClickerPro-v1.2.6-APK
        path: "**/app/build/outputs/apk/debug/*.apk"
        if-no-files-found: warn

    - name: Create or Update GitHub Release with Direct APK Download
      uses: softprops/action-gh-release@v2
      if: success()
      continue-on-error: true
      with:
        tag_name: v1.2.6-build-${{ github.run_number }}
        name: "Timer Auto Clicker Pro v1.2.6 最新APK (解凍不要)"
        body: |
          ### 📱 Timer Auto Clicker Pro (v1.2.6 最新版)
          - 【増殖・終了バグ完全解消】バー（HUD）増殖および終了ボタンで消えない問題を根本解決
          - 【即時消去】HUD終了ボタンおよびメイン画面の「🛑 終了 / 🛑 バー消去」で全オーバーレイを即時完全削除
          - クリックアシスタント等の他アプリに潜り込まない「絶対的最前面（Accessibility Overlay）」安全保護
          - 直下にある `TimerAutoClickerPro-v1.2.6.apk` をタップすると**解凍不要で直接インストール**できます！
        files: |
          **/app/build/outputs/apk/debug/*.apk
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
