- name: Prepare Fixed Keystore for Seamless Overwrite Updates
      run: |
        mkdir -p ~/.android
        KEYSTORE_B64=""
        echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore || echo "$KEYSTORE_B64" | base64 -di > ~/.android/debug.keystore
        find . -type d -name "app" -exec cp ~/.android/debug.keystore {}/debug.keystore \;
