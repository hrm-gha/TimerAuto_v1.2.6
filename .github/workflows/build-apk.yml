name: Build Timer Auto Clicker APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Unpack Project Zip if Present
      run: |
        # If user uploaded the project as a ZIP archive, unpack it
        TARGET_ZIP=$(find . -maxdepth 2 -type f \( -name "*1.2.7*.zip*" -o -name "*1.2.6*.zip*" -o -name "*.zip" -o -name "*.zip.html" \) | sort -V | tail -n 1)
        if [ -n "$TARGET_ZIP" ]; then
          echo "Found project archive: $TARGET_ZIP"
          if [[ "$TARGET_ZIP" == *.html ]]; then
            CLEAN_ZIP="${TARGET_ZIP%.html}"
            mv "$TARGET_ZIP" "$CLEAN_ZIP"
            TARGET_ZIP="$CLEAN_ZIP"
          fi
          if [ ! -d "app/src" ]; then
            echo "Unpacking archive to root..."
            unzip -o "$TARGET_ZIP" || true
          else
            echo "Direct source tree already present."
            unzip -u -o "$TARGET_ZIP" || true
          fi
        fi

    - name: Ensure Fixed Signing Keystore Exists (Enables Overwrite Updates)
      run: |
        mkdir -p app
        # If debug.keystore is missing, decode the permanent keystore to guarantee identical signature across all builds
        if [ ! -f "app/debug.keystore" ]; then
          echo "Restoring permanent fixed keystore for seamless overwrite updates..."
          echo "" | base64 -d > app/debug.keystore
        fi

    - name: Build APK with Gradle
      run: |
        TARGET=$(find . -name "settings.gradle.kts" | head -n 1)
        if [ -n "$TARGET" ]; then
          PROJECT_DIR="$(dirname "$TARGET")"
        else
          PROJECT_DIR="."
        fi
        echo "Building in $PROJECT_DIR"
        cd "$PROJECT_DIR"

        echo "android.useAndroidX=true" > gradle.properties
        echo "android.nonTransitiveRClass=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

        if [ ! -f gradlew ]; then
          gradle wrapper --gradle-version 8.6 || true
        fi

        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        else
          gradle assembleDebug --no-daemon --stacktrace
        fi

    - name: Prepare Clean Single Named APK
      run: |
        APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
        if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
          DIR=$(dirname "$APK_PATH")
          # Move instead of copy to eliminate redundant app-debug.apk
          mv "$APK_PATH" "$DIR/TimerAutoClickerPro-v1.2.7.apk"
          echo "Renamed $APK_PATH to $DIR/TimerAutoClickerPro-v1.2.7.apk"
        fi

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: TimerAutoClickerPro-v1.2.7-APK
        path: "**/app/build/outputs/apk/debug/TimerAutoClickerPro-v1.2.7.apk"
        if-no-files-found: warn

    - name: Create or Update GitHub Release with Direct APK Download
      uses: softprops/action-gh-release@v2
      if: success()
      continue-on-error: true
      with:
        tag_name: v1.2.7-build-${{ github.run_number }}
        name: "Timer Auto Clicker Pro v1.2.7 最新APK (解凍不要)"
        body: |
          ### 📱 Timer Auto Clicker Pro (v1.2.7 最新版)
          - 【小型化】①時限装置（自動タップ）ボタンを従来の2/3サイズにスリム化し、より緻密な配置が可能に
          - 【HUDスマート化】「最前」ボタンを表から撤去し、5個のすっきりしたボタン構成に刷新
          - 【上書きアップデート対応】固定署名キーストアにより、毎回アンインストール不要で上書きインストール可能
          - 【単一APK化】不要な `app-debug.apk` を排除し、`TimerAutoClickerPro-v1.2.7.apk` のみを出力
          - 直下にある `TimerAutoClickerPro-v1.2.7.apk` をタップすると**解凍不要で直接インストール**できます！
        files: |
          **/app/build/outputs/apk/debug/TimerAutoClickerPro-v1.2.7.apk
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
